[project]
name = "nutrifix"
version = "0.3.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "joblib==1.6.0",
    "numpy==2.5.2",
    "pandas==2.2.3",
    "Pillow==12.2.0",
    "PyMuPDF==1.28.2",
    "pydantic==2.13.5",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.32",
    "scikit-learn==1.9.0",
    "scipy==1.18.0",
]

[tool.vercel]
entrypoint = "api:app"

[tool.vercel.scripts]
build = "npm --prefix frontend ci && npm --prefix frontend run build"

